[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proforma-20q"
version = "0.1.0"
description = "ProForma-20Q: a benchmark for joint probabilistic forecasting of complete quarterly financial statements at horizons 1-20 quarters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
    "benchmark", "financial-forecasting", "compustat", "time-series",
    "probabilistic-forecasting", "quarterly-financials",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Runtime deps are kept deliberately loose so the scoring/baseline path installs
# on any modern scientific-Python stack -- upper bounds only at the next major,
# matching the companion repo's convention (the suite passes under both pandas 2
# and pandas 3). For a BIT-EXACT canonical rebuild (whose md5s match the
# published checksums) install the pinned lockfile instead:
#     pip install -r requirements-lock.txt
# See README "Reproducing the canonical build".
dependencies = [
    "numpy<3",
    "pandas>=2,<4",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "fastparquet>=2024.2",
    "pyyaml>=6,<7",
    "joblib>=1,<2",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# The WRDS client is only needed for `proforma20q download` / `build`. Scoring a
# forecast file and running the baselines never touch it.
wrds = ["wrds"]
# The Hugging Face client is only needed to fetch the gated Compustat-derived
# artifacts (`build --reg-stats canonical`, `report-drift`, and
# scripts/download_artifacts.py). `validate` and `evaluate` against examples/
# are credential-free and never import it -- see README "Code and data are
# licensed separately".
data = ["huggingface_hub>=0.23"]
dev = ["pytest>=7", "pyarrow", "huggingface_hub>=0.23"]

[project.scripts]
proforma20q = "proforma20q.cli:main"

[project.urls]
# Placeholder owner through the double-blind review window, matching
# CITATION.cff. The anonymous mirror serves this file verbatim, so a real
# org name here would deanonymize the submission. Restore at C6 (go-public).
Homepage = "https://github.com/forma-lab-mccombs/proforma-20q"
Repository = "https://github.com/forma-lab-mccombs/proforma-20q"
Issues = "https://github.com/forma-lab-mccombs/proforma-20q/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# No reference/*.parquet: the canonical regularization statistics are
# Compustat-derived and are fetched from a gated repository, not packaged. The
# reference/*.csv id maps are item names and integer orderings only.
proforma20q = ["configs/*.yaml", "configs/*.json", "checksums.json", "reference/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
